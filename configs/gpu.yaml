# Full-scale profile, layered in automatically whenever dry_run=false.
# Restores every cost knob that dry_run.yaml downgrades.
dry_run: false
offline: false
group_size: 8
num_steps: 120
num_prompts: 400
seeds: [0]
# Prompt corpus seed (held fixed across replicates). training/generation use `seed`.
data_seed: 0
atlas_shuffle_prompts: false
reference_baseline_mode: prompt
cot_min_reasoning_in_gate: true
cot_require_reasoning_tags: true
cot_min_reasoning_chars: 200
cot_min_reasoning_words: 40
cot_require_problem_tokens: false
project_name: Spoof Cost
wandb_project: spoof-cost
model_name: meta-llama/Llama-3.1-8B-Instruct
lora_r: 64
lora_alpha: 128
# 2-GPU budget (train + vLLM).
train_batch_size: 16
eval_steps: 120
save_steps: 20
eval_num_prompts: 128
detector_pretrain_steps: 200
detector_model_batch_size: 32
detector_train_every_n_steps: 10000
# E2 Probe injection. scripts/run.sh overrides the cache per seed/monitor.
indomain_probe_path: results/e1/indomain_probe/probe.json
indomain_activation_cache: artifacts/indomain_probe/activations_seed_0_none
resume_from_checkpoint: false
