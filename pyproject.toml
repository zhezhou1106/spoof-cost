[project]
name = "spoof-cost"
version = "0.1.0"
description = "Spoof Cost: counterfactual prefix monitoring (SCL) under optimization pressure on MBPP-Honeypot-CoT"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Zhe Zhou", email = "zhou1106@cs.washington.edu" },
    { name = "Tianhua Tao", email = "tianhuat@cs.washington.edu" },
]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
atlas = [
    "obfuscation-atlas",
    "afterburner",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["env*", "monitors*", "scl*", "reward*", "training*", "eval*", "config*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv]
# Prefer published CUDA wheels over a from-source vLLM build.
no-build-package = ["vllm"]

[tool.uv.sources]
obfuscation-atlas = { path = "third_party/obfuscation-atlas", editable = true }
afterburner = { path = "third_party/obfuscation-atlas/third_party/afterburner", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "scripts", "tests"]
